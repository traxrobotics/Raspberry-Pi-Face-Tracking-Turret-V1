[project]
name = "pi5-face-tracking-turret"
version = "1.3.0"
description = "Face tracking pan and tilt turret for Raspberry Pi 5 with an ArduCAM Mini 2MP Plus and two SG90 servos"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Veer Sharma (Trax)" }]

[tool.pytest.ini_options]
# The test_*.py files in the top folder are hardware checks you run on the Pi by hand.
# The automatic tests live in tests/ and need no hardware.
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
